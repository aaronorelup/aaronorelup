<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Aaron Orelup — Diving head first into the future with wide eyes and a brazen heart. Bastrop, Texas">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF5EA"/>
      <stop offset="62%" stop-color="#F7EEE0"/>
      <stop offset="100%" stop-color="#F1E4D2"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B9C5E"/>
      <stop offset="100%" stop-color="#6E7F49"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8B57C" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#8B9C5E" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1058" cy="104" r="46" fill="#EFC7CE" opacity=".55"/>
  <circle cx="1058" cy="104" r="30" fill="#E9AFBA" opacity=".45"/>

  <!-- far hills -->
  <path d="M0 258 C 150 218, 300 248, 430 262 C 560 276, 700 236, 860 248 C 1000 258, 1140 232, 1280 246 L1280 320 L0 320 Z" fill="url(#hill2)"/>
  <path d="M0 284 C 190 260, 340 294, 520 290 C 720 286, 860 262, 1040 278 C 1150 288, 1220 282, 1280 276 L1280 320 L0 320 Z" fill="url(#hill)"/>

  <!-- tea house silhouette -->
  <g transform="translate(940 172)" fill="#A6704A">
    <path d="M-92 26 L0 -12 L92 26 L74 26 L74 30 L-74 30 L-74 26 Z" opacity=".92"/>
    <rect x="-58" y="30" width="116" height="58" opacity=".85"/>
    <rect x="-30" y="48" width="26" height="40" fill="#FBF5EA" opacity=".8"/>
    <rect x="8" y="48" width="26" height="40" fill="#FBF5EA" opacity=".8"/>
    <rect x="-62" y="86" width="124" height="6" opacity=".95"/>
  </g>
  <!-- lantern glow -->
  <circle cx="1042" cy="218" r="8" fill="#D9A441" opacity=".9"/>

  <!-- petals — kept clear of the type block -->
  <g fill="#E9AFBA" opacity=".8">
    <ellipse cx="180" cy="42" rx="6.5" ry="4" transform="rotate(-24 180 42)"/>
    <ellipse cx="322" cy="52" rx="5.5" ry="3.5" transform="rotate(12 322 52)"/>
    <ellipse cx="620" cy="44" rx="5" ry="3.2" transform="rotate(30 620 44)"/>
    <ellipse cx="782" cy="58" rx="6" ry="4" transform="rotate(-8 782 58)"/>
    <ellipse cx="884" cy="34" rx="5" ry="3.2" transform="rotate(22 884 34)"/>
    <ellipse cx="866" cy="154" rx="6" ry="4" transform="rotate(-16 866 154)"/>
    <ellipse cx="1152" cy="96" rx="5.5" ry="3.5" transform="rotate(40 1152 96)"/>
    <ellipse cx="1196" cy="196" rx="5" ry="3.2" transform="rotate(-34 1196 196)"/>
  </g>

  <!-- type -->
  <text x="80" y="126" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="62" font-weight="600" fill="#2E3440" letter-spacing="-0.5">Aaron Orelup</text>
  <text x="82" y="168" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17.5" fill="#5B6472">Diving head first into the future with wide eyes and a brazen heart.</text>
  <rect x="82" y="188" width="86" height="3" fill="#D9A441"/>
  <text x="82" y="220" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8A7355" letter-spacing="2.2">BASTROP, TEXAS</text>
</svg>
